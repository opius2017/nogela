# .circleci/config.yml
version: 2.1

orbs:
  node: circleci/node@5.2.0
  docker: circleci/docker@2.3.0

executors:
  node-executor:
    docker:
      - image: cimg/node:22.4
    working_directory: ~/project/frontend

  dotnet-executor:
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:9.0
        environment:
          ASPNETCORE_ENVIRONMENT: "Development"
      - image: mcr.microsoft.com/mssql/server:2022-latest
        environment:
          SA_PASSWORD: "StrongPassword@123"
          ACCEPT_EULA: "Y"
    working_directory: ~/project/backend

  docker-executor:
    docker:
      - image: cimg/base:stable
    working_directory: ~/project

jobs:
  # 1️⃣ FRONTEND BUILD (Next.js 15)
  setup-frontend:
    executor: node-executor
    working_directory: ~/project
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
          app-dir: ~/project/frontend
      - run:
          name: Build frontend
          command: npm run build
      - run:
          name: Move to frontend folder
          command: cd frontend && npm install && npm run build
      - persist_to_workspace:
          root: .
          paths:
            - frontend

  # 2️⃣ BACKEND BUILD (.NET 9)
  setup-backend:
    executor: dotnet-executor
    steps:
      - checkout
      - run:
          name: Restore .NET dependencies
          command: dotnet restore backend
      - run:
          name: Build backend solution
          command: dotnet build backend --configuration Release
      - run:
          name: Run database migrations
          command: dotnet ef database update --project backend/Infrastructure
      - run:
          name: Run backend tests
          command: dotnet test backend.Tests --configuration Release --no-build --logger "trx;LogFileName=test_results.trx"
      - persist_to_workspace:
          root: .
          paths:
            - backend/bin
            - backend/obj

  # 3️⃣ DOCKER BUILD & PUSH
  docker-build-and-push:
    executor: docker-executor
    environment:
      DOCKER_HUB_USERNAME: your-dockerhub-username
      DOCKER_HUB_REPO: your-repo-name
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - attach_workspace:
          at: .
      - run:
          name: Build Docker images
          command: |
            docker build -t $DOCKER_HUB_USERNAME/frontend:latest ./frontend
            docker build -t $DOCKER_HUB_USERNAME/backend:latest ./backend
      - run:
          name: Push images to Docker Hub
          command: |
            echo $DOCKERHUB_PASS | docker login -u $DOCKER_HUB_USERNAME --password-stdin
            docker push $DOCKER_HUB_USERNAME/frontend:latest
            docker push $DOCKER_HUB_USERNAME/backend:latest

  # 4️⃣ DEPLOYMENT JOB
  deploy:
    executor: docker-executor
    steps:
      - run:
          name: Deploy with docker-compose
          command: |
            docker-compose -f docker-compose.prod.yml up -d
      - run:
          name: Verify deployment health
          command: curl -f http://localhost:8080/health || exit 1

workflows:
  version: 2
  build-test-deploy:
    jobs:
      - setup-frontend
      - setup-backend:
          requires:
            - setup-frontend
      - docker-build-and-push:
          requires:
            - setup-backend
      - deploy:
          requires:
            - docker-build-and-push
